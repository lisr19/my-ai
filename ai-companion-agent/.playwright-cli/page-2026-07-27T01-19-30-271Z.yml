      - generic [ref=e51]: 同学，那我来给你讲一个发生在初中英语课堂上的小故事吧。 记得去年我带初三的时候，班上有个叫小明的男生，特别害怕英语，一提到背单词、做阅读就愁眉苦脸的。期中考试，他的英语只考了58分，连及格线都没过。那天发完试卷，他一个人坐在座位上，低着头不说话，其他同学都走了，他还不走。 我走过去，轻轻拍了拍他的肩膀说："小明，放学了，怎么还不回家呀？"他抬起头，眼眶有点红："老师，我是不是特别笨？英语怎么学都学不好。"我笑了笑，在他旁边坐下："来，老师跟你讲个故事。" 我说，你知道吗？其实老师上初中的时候，英语也是一塌糊涂。初一上学期期末考试，我考了42分，全班倒数第三。那时候我特别想放弃，觉得自己就不是学英语的料。但是有一天，我英语老师跟我说了一句话，改变了我。她说："你记住，语言不是靠天赋，是靠积累。你每天比别人多背5个单词，一年就是1825个单词，三年就是5475个，足够考高中的了。" 小明听了，眼睛亮了亮："真的吗，老师？"我点点头："真的。从那天起，我就给自己定了一个小目标：一天只背5个新单词，但必须复习前天背过的5个。你说难不难？"他摇摇头说："5个单词，不难。"我说："对呀，一点都不难。难的是坚持，每天雷打不动地执行。" 然后我又教他一个方法：把单词写在便利贴上，贴在床头、书桌、冰箱上，每天刷牙、吃饭前看一眼。我还告诉他，每个单词要用三遍：第一遍认读，第二遍默写，第三遍造句。这样，这个单词就是你的了。 小明听了很
