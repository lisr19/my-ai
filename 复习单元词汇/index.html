<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习单元词汇 - 初中英语词汇复习工具</title>
<link rel="stylesheet" href="lib/element-plus.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-inner">
      <h1 class="logo">📖 复习单元词汇</h1>
      <nav class="tabs">
        <button v-for="t in tabs" :key="t.id"
                :class="['tab', { active: store.activeTab === t.id }]"
                @click="store.activeTab = t.id">
          {{ t.name }}
          <span v-if="t.id === 'wrong' && totalWrong > 0" class="tab-badge">{{ totalWrong }}</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div v-if="!store.ready" class="empty">正在加载本地数据…</div>
    <template v-else>
      <library-view v-if="store.activeTab === 'library'"></library-view>
      <review-view v-else-if="store.activeTab === 'review'"></review-view>
      <match-view v-else-if="store.activeTab === 'match'"></match-view>
      <wrong-view v-else-if="store.activeTab === 'wrong'"></wrong-view>
    </template>
  </main>
</div>

<script src="lib/vue.global.prod.js"></script>
<script src="lib/element-plus.full.min.js"></script>
<script src="lib/element-plus.locale.zh-cn.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/speech.js"></script>
<script src="js/excel.js"></script>
<script src="js/samples.js"></script>
<script src="js/samples-g7a.js"></script>
<script src="js/samples-g8a.js"></script>
<script src="js/samples-g8b.js"></script>
<script src="js/app.js"></script>
</body>
</html>
